  const mn=Math.min(...C.map(c=>c[3])),mx=Math.max(...C.map(c=>c[2])),Y=v=>(138-(v-mn)/(mx-mn||1)*124).toFixed(1),w=300/C.length;

const A11Y_HTML="<p class=\"tcm\">Last updated: 19 October 2026</p><h3>Our commitment</h3><p>Wally Street is a learning game about stocks and markets. We want people with different abilities, devices and assistive technology to be able to use it. We are working toward the Web Content Accessibility Guidelines (WCAG) 2.1 level AA. This statement is our own review. It is not a certified audit, and we have not had an independent accessibility audit.</p><h3>What we have done</h3><ul><li><b>Phones and laptops.</b> The layout adapts to the screen size. On a laptop the menu moves to a side bar, and pinch zoom on phones is not blocked.</li><li><b>Keyboard.</b> Buttons, links and fields are real controls that you can reach with the Tab key, and they show a visible focus outline. In lessons on a laptop you can press 1, 2 or 3 to pick an answer, Enter to check or continue, and Esc to leave.</li><li><b>Light and dark themes.</b> The app follows your device setting. You can switch in Manage account, then Appearance.</li><li><b>Reduced motion.</b> If your device asks for reduced motion, animations are turned off.</li><li><b>Labels for screen readers.</b> Icon buttons, form fields and charts have text labels. Right and wrong answers are shown in words (\"Correct!\", \"Correct answer: ...\") and not by colour alone.</li><li><b>Tutorial videos.</b> Every tutorial scene shows its narration as on-screen text. Voice is optional and off by default, and you can pause, go back or skip. Nothing plays sound without your action.</li><li><b>Clear errors.</b> Sign-in problems are explained in plain text next to the form.</li></ul><h3>Known limits</h3><ul><li>Price charts, candlestick charts and quiz charts are drawn images. Their text label is short and does not describe every data point. The tables next to the Practice charts give prices and changes as text.</li><li>The chart crosshair works with touch and mouse but has no keyboard version yet.</li><li>Some muted grey text and parts of the dark Practice screen may be below the AA contrast ratio.</li><li>Tutorial scenes move on by themselves after a few seconds. You can press Pause, but some people may need more time than the default.</li><li>The Ask tutor is a text box with replies that appear below it. We have not tested it with screen readers.</li><li>Narration uses the voices installed on your device, so quality and gender vary. You can choose another voice in Manage account.</li><li>We have not tested every combination of browser and assistive technology. Fonts load from Google Fonts, so the page falls back to your device fonts if they cannot load.</li></ul><h3>Tell us about a problem</h3><p>If something is hard to use, please tell the operator through the same channel you used to get the app, and say what you were trying to do, which device and browser you used, and which assistive technology you use if any. We aim to reply in a reasonable time and to fix what we can. If you are not happy with our reply, you may contact the accessibility or consumer authority where you live.</p>";

function gateStatus(){const e=$('#gst');if(e)e.textContent=cloud?'☁️ Cloud sync is on. Your data is kept in your own private space: log in on any device signed in to the same claude.ai account.':'📱 On this link, accounts are saved on this device only. Open the accounts link to sync across devices.'}
function renderGate(err){$('#gate').innerHTML=`<div class="gw"><div class="hero"><img class="mas" src="${BULL}" alt="Bruno the bull"><img class="mas big" src="${WOLF}" alt="Wally the wolf"><img class="mas" src="${BEAR}" alt="Bella the bear"></div><h1 class="gh"><span>Wally</span> Street</h1><p class="gsub">Learn stocks. Trade on paper. Become a wizard.</p>
<div class="gt"><button data-gm="in" class="${gmode=='in'?'on':''}">Log in</button><button data-gm="up" class="${gmode=='up'?'on':''}">Sign up</button></div>
<div class="gf"><label for="gu">Username</label><input id="gu" class="inp" autocomplete="username" maxlength="20" autocapitalize="none" spellcheck="false" value="${esc(LN)}"><label for="gp">Password</label><input id="gp" class="inp" type="password" maxlength="128" autocomplete="${gmode=='in'?'current-password':'new-password'}">${gmode=='up'?'<p class="xs2" style="margin:-4px 0 8px">At least 8 characters, not a common password, and not your username.</p><label for="gp2">Confirm password</label><input id="gp2" class="inp" type="password" autocomplete="new-password">':''}<label class="gk"><input type="checkbox" id="gkeep" checked> Keep me signed in on this device</label><label class="gk" style="margin-top:10px"><input type="checkbox" id="gagree"${GAG?' checked':''}> <span>I have read and agree to the <a href="#" id="gtl">Terms and Conditions</a></span></label></div>
<div class="gerr" id="ge">${err||''}</div><button class="btn" id="gok" style="width:100%"${GAG?'':' disabled'}>${gmode=='in'?'Log in':'Create account'}</button><button class="btn ghost" id="ggu" style="width:100%;margin-top:12px"${GAG?'':' disabled'}>Play as guest</button><button class="btn ghost" id="gno" style="width:100%;margin-top:12px">I do not agree</button><p class="gs" id="gst"></p><p class="gs" style="margin-top:6px"><a href="#" id="gal">Accessibility statement</a></p></div>`;gateStatus()}
function showGate(m){gmode=m||'in';GAG=false;$('#gate').style.display='block';renderGate()}
async function signup(n,pw){const uid=await uidOf(n);let c=null;if(cloud){try{const sn=await gw('cloud.read',()=>cdoc(cpath(uid)).get(),{retries:1});if(sn.exists)c=1}catch(e){}}
 if(c||LS('stockgpt:acct:'+uid))return 'That username is already taken.';
 if(S.name=='Trader')S.name=n;const kdf=newKdf();ACC={name:n,uid,kdf,key:await mkKey(pw,n,kdf)};await pushAcc();return ''}
async function login(n,pw){const uid=await uidOf(n),C=[],bad='Wrong username or password.'+(cloud?'':' On this link, accounts are saved on this device only.');let legacy=false;
 if(cloud){try{const sn=await gw('cloud.read',()=>cdoc(cpath(uid)).get(),{retries:1});if(sn.exists)C.push(sn.data());else{try{const lg=await cdoc('acct/'+uid).get();if(lg.exists){C.push(lg.data());legacy=true}}catch(e){}}}catch(e){}}
 const l=LS('stockgpt:acct:'+uid);if(l&&l.iv)C.push(l);if(!C.length)return bad;
 C.sort((a,b)=>(b.t||0)-(a.t||0));let key,d,rec;for(const b of C){try{const k=await mkKey(pw,n,b.kdf);d=await unseal(k,b);key=k;rec=b;break}catch(e){}}
 if(!d)return bad;let kdf=rec.kdf;if(!kdf||!kdf.s||!(kdf.i>=KDF_N)){kdf=newKdf();key=await mkKey(pw,n,kdf);log('info','password protection upgraded to a random salt and 600,000 rounds')}
 S=cleanS(d.S);X=d.X?cleanX(d.X):{cash:1e5,pos:{}};ACC={name:n,uid,key,kdf};await pushAcc();
 if(legacy&&ACC.cloud){try{await cdoc('acct/'+uid).delete()}catch(e){}log('info','cloud copy moved to private storage')}return ''}
async function enter(keep){S.tc={v:TERMS_V,t:new Date().toISOString()};save();$('#gate').style.display='none';try{localStorage.setItem('stockgpt:last',ACC.name);if(keep){try{await sessSave()}catch(e){log('warn','this browser could not keep you signed in');try{localStorage.removeItem('stockgpt:sess')}catch(x){}}}else await sessClear()}catch(e){}refreshAll();syncFromCloud()}
function logout(){sessClear();clearTimeout(syncT);ACC=null;S=cleanS({});X={cash:1e5,pos:{}};$('#ac').style.display='none';refreshAll();showGate('in')}
$('#gate').onchange=e=>{if(e.target.id=='gagree'){GAG=e.target.checked;$('#gok').disabled=$('#ggu').disabled=!GAG}};
$('#gate').onclick=async e=>{if(e.target.id=='gtl'){e.preventDefault();showTerms(true);return}if(e.target.id=='gal'){e.preventDefault();showDoc('Accessibility statement',A11Y_HTML);return}const b=e.target.closest('button');if(!b)return;
 if(b.dataset.gm){LN=$('#gu').value.trim();gmode=b.dataset.gm;renderGate()}
 else if(b.id=='gno')declined();
 else if(b.id=='ggu'){if(!$('#gagree').checked)return;try{localStorage.setItem('stockgpt:terms',JSON.stringify({v:TERMS_V,t:new Date().toISOString()}))}catch(x){}$('#gate').style.display='none'}
 else if(b.id=='gok'){const n=$('#gu').value.trim(),pw=$('#gp').value,keep=$('#gkeep').checked;LN=n;GAG=$('#gagree').checked;
  if(!GAG)return renderGate('Please agree to the Terms and Conditions to continue.');
  if(!/^[A-Za-z0-9_]{3,20}$/.test(n))return renderGate('Username must be 3 to 20 letters, numbers or underscores.');
  if(gmode=='up'){const pi=pwIssue(pw,n);if(pi)return renderGate(pi)}else if(pw.length<6||pw.length>128)return renderGate('Wrong username or password.');
  if(gmode=='up'&&pw!=$('#gp2').value)return renderGate('The two passwords do not match.');
  const lim=rlBlock(gmode);if(lim)return renderGate(lim);
  b.disabled=true;b.textContent='Please wait…';await ready();
  const err=await(gmode=='up'?signup(n,pw):login(n,pw));rlRecord(gmode,!err);if(err)return renderGate(err);try{localStorage.setItem('stockgpt:terms',JSON.stringify({v:TERMS_V,t:new Date().toISOString()}))}catch(x){}await enter(keep)}};
addEventListener('pagehide',()=>{if(ACC)pushAcc()});
$('#gate').style.display='block';$('#gate').innerHTML='<div class="gw"><p class="gs" style="margin-top:40vh">Loading…</p></div>';
async function startup(){try{const ss=LS('stockgpt:sess');if(ss&&ss.iat&&Date.now()-ss.iat>30*864e5){await sessClear();log('info','session expired after 30 days; please log in again')}else if(ss&&/^[0-9a-f]{32}$/.test(ss.uid||'')&&/^[A-Za-z0-9_]{3,20}$/.test(ss.name||'')){const l=LS('stockgpt:acct:'+ss.uid),key=ss.jwk?await crypto.subtle.importKey('jwk',ss.jwk,{name:'AES-GCM'},false,['encrypt','decrypt']):await kget('sess'),d=await unseal(key,l);
 S=cleanS(d.S);X=d.X?cleanX(d.X):{cash:1e5,pos:{}};ACC={name:ss.name,uid:ss.uid,key,kdf:l.kdf};try{await sessSave()}catch(e){if(ss.jwk)try{localStorage.removeItem('stockgpt:sess')}catch(x){}}log('info',ss.jwk?'session key moved into the browser vault':'session renewed');$('#gate').style.display='none';refreshAll();await ready();syncFromCloud();return}}catch(e){}
 showGate('in')}
$('#tc').addEventListener('keydown',e=>{if(e.target.id=='agi'&&e.key=='Enter'){e.preventDefault();ageSubmit()}});
opsInit();
ageGate();
document.addEventListener('keydown',e=>{if($('#ls').style.display!='flex'||e.target.tagName=='INPUT')return;
 if(e.key>='1'&&e.key<='3'){const o=document.querySelectorAll('.opt')[+e.key-1];if(o)o.click()}
 else if(e.key=='Enter'){const b=$('#chk:not([disabled])')||$('#nx')||$('#st')||$('#fin');if(b)b.click()}
 else if(e.key=='Escape')quit()});
renderLearn();head();
