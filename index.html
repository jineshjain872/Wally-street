/* printing */
@media print{
:root,:root[data-theme=dark],:root:not([data-theme=light]),html.hc{--bg:#fff!important;--card:#fff!important;--ink:#000!important;--mute:#333!important;--line:#999!important}
@page{margin:14mm}
html,body{background:#fff!important;color:#000!important;height:auto!important;overflow:visible!important}
#app,main,.view.on{height:auto!important;overflow:visible!important;display:block!important;max-width:none!important}
header,nav,#scta,.fab,.btt,.spb,#ckb,.tst,.cfx,.skip,.cfm,.tcf,#chips,#bar2,#tools,#aqp,.pntabs,.srb,.ql,.mfx{display:none!important}
.amts .btn,.amts button,.btn.cta{display:none!important}
html.p-tc #app,html.p-tc #ls,html.p-tc #ac,html.p-ls #app,html.p-ac #app{display:none!important}
html.p-tc #tc{position:static!important;display:block!important;background:#fff!important;inset:auto}
html.p-tc .tcs{overflow:visible!important;max-width:none;padding:0}
html.p-ls #ls,html.p-ac #ac{position:static!important;display:block!important}html.p-ls #qb,html.p-ls #ft{overflow:visible!important}
.card,.cd,.bd,.unit,.faq,.sri,.dg,.pk,details{break-inside:avoid;box-shadow:none!important}
.mas{filter:none!important}.shimg{max-width:100%;border:0}
#prac,#prac *{background:#fff!important;color:#000!important;border-color:#aaa!important;box-shadow:none!important}
a[href^="http"]::after{content:" (" attr(href) ")";font-size:85%;color:#333;word-break:break-all}
h2,h3{break-after:avoid}
}

.dgh{flex-wrap:wrap}.dgh h3{white-space:nowrap}
@media(min-width:700px){
#app{max-width:1280px;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;padding:14px 28px}.logo{font-size:30px}.pill{font-size:16px;padding:6px 14px}
main{grid-column:2;grid-row:2}
nav{grid-column:1;grid-row:2;flex-direction:column;justify-content:flex-start;border-top:0;border-right:2px solid var(--line);padding:16px 12px;gap:6px}
nav button{display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;padding:12px 14px;border-radius:12px}nav button:hover{background:var(--line)}nav span{display:inline;font-size:22px}
#learn,#news,#picks,#hist,#dev{padding:28px max(32px,calc((100% - 880px)/2))}
.gr{grid-template-columns:repeat(3,1fr)}.gc:hover,.opt:hover,.chip:hover,.tl:hover,.row:hover,.btn:hover{filter:brightness(.96)}
#hist.on{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}#hist .card{margin:0}#hist>.mrow{grid-column:1/-1;margin:0}
#news.on{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}#news .card{margin:0}#news>.card:first-child{grid-column:1/-1}
#msgs{padding:24px max(32px,calc((100% - 820px)/2))}.m{max-width:75%;font-size:16px}
#chips,#tools,#bar2,#chat .note{width:100%;max-width:820px;margin-left:auto;margin-right:auto}
.in{max-width:760px}#qb h2{font-size:30px}.opt{font-size:19px}.cvw svg{height:250px}.node:hover:not(:disabled){filter:brightness(1.07)}
#prac.on{display:grid;grid-template-columns:1fr 1fr;align-content:start}
#prac>.tape,#prac>.xp{grid-column:1/-1}
#pn{grid-template-columns:1fr 1fr}#pn .cw svg{height:230px}.tape{font-size:15px}
#dev .pic{max-width:640px;display:block;margin-left:auto;margin-right:auto}#dev .cl{columns:2}nav button{flex:0 0 auto}
}

"Fees such as commissions and fund expense ratios eat into returns over time. Beware promises of guaranteed or risk-free profits, pump-and-dump hype and thinly traded penny stocks. Research a company before you buy.",
"The income statement shows revenue (sales), costs and profit. Gross profit is revenue minus the cost of goods sold. Net income is what remains after all costs and taxes, and EPS is net income divided by shares.",
"The balance sheet lists assets (what a company owns), liabilities (what it owes) and equity (assets minus liabilities). Ratios like debt-to-equity show how much a company relies on borrowing.",
"An index fund copies a market index at low cost. An active fund tries to beat it by picking investments, usually for higher fees, and many lag their index after fees. Mutual funds price once a day; ETFs trade all day.",

"Value investors buy stocks trading below their estimated worth; growth investors buy fast-expanding companies that reinvest profits. A value trap looks cheap but stays cheap because the business is struggling.",
"Liquidity is how easily you can trade without moving the price. Thinly traded stocks have wider spreads. A stop-loss order sells if the price falls to a level you choose, but it can't promise a price in a fast crash.",
