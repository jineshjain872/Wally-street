/* printing */
@media print{
:root,:root[data-theme=dark],:root:not([data-theme=light]),html.hc{--bg:#fff!important;--card:#fff!important;--ink:#000!important;--mute:#333!important;--line:#999!important}
@page{margin:14mm}
html,body{background:#fff!important;color:#000!important;height:auto!important;overflow:visible!important}
#app,main,.view.on{height:auto!important;overflow:visible!important;display:block!important;max-width:none!important}
header,nav,#scta,.fab,.btt,.spb,#ckb,.tst,.cfx,.skip,.cfm,.tcf,#chips,#bar2,#tools,#aqp,.pntabs,.srb,.ql,.mfx{display:none!important}
.amts .btn,.amts button,.btn.cta{display:none!important}
html.p-tc #app,html.p-tc #ls,html.p-tc #ac,html.p-ls #app,html.p-ac #app{display:none!important}
html.p-tc #tc{position:static!important;display:block!important;background:#fff!important;inset:auto}
html.p-tc .tcs{overflow:visible!important;max-width:none;padding:0}
html.p-ls #ls,html.p-ac #ac{position:static!important;display:block!important}html.p-ls #qb,html.p-ls #ft{overflow:visible!important}
.card,.cd,.bd,.unit,.faq,.sri,.dg,.pk,details{break-inside:avoid;box-shadow:none!important}
.mas{filter:none!important}.shimg{max-width:100%;border:0}
#prac,#prac *{background:#fff!important;color:#000!important;border-color:#aaa!important;box-shadow:none!important}
a[href^="http"]::after{content:" (" attr(href) ")";font-size:85%;color:#333;word-break:break-all}
h2,h3{break-after:avoid}
}

/* keep the end of Learn visible above the sticky lesson button on phones */
body:has(#scta:not([hidden])) #learn{padding-bottom:120px}
.plb{margin:8px 0 4px;padding:10px 12px;border-radius:12px;border:1px solid #2a3347;background:#0b0f17}.plh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font-size:13px}.plh span{color:#9aa3b5}.plh b{font-size:18px}.plh small{font-size:12px}.pld{font-size:11px;color:#9aa3b5;margin-top:4px}
.plb .g{color:#3ddc97}.plb .r{color:#ff6b6b}.plb .z{color:inherit}

.wc::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.85) 48%,rgba(255,255,255,0) 62%);transform:translateX(-130%);animation:wcsh 4.5s ease-in-out infinite}
@keyframes wcsh{0%,62%{transform:translateX(-130%)}82%,100%{transform:translateX(130%)}}
.wc.big{width:44px;height:44px;vertical-align:middle}
#hx .wc{margin-right:2px}#hx.wcbump{animation:wcbump .55s ease}#hx.wcbump .wc{animation:wcspin .7s ease}#hx.wcdrain{animation:wcdrain .45s ease}
@keyframes wcbump{30%{transform:scale(1.18);box-shadow:0 0 0 4px rgba(255,200,40,.45),0 0 22px 6px rgba(255,200,40,.55)}}
@keyframes wcspin{to{transform:rotateY(720deg)}}
@keyframes wcdrain{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}50%{color:var(--r)}}
.wcf{position:fixed;left:0;top:0;width:24px;height:24px;z-index:95;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.wcs{display:inline-flex;align-items:center;gap:6px}.wcs .wc{width:1.4em;height:1.4em;animation:wcspin 1.2s ease .2s}
.wcsp{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff3a0;box-shadow:0 0 8px 3px rgba(255,214,70,.9);pointer-events:none;z-index:96}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(prefers-reduced-motion:reduce){.wc::after,#hx.wcbump,#hx.wcbump .wc,#hx.wcdrain,.wcs .wc{animation:none}}
@media print{.wc::after{display:none}.wcf,.wcsp{display:none}}
.dgh{flex-wrap:wrap}.dgh h3{white-space:nowrap}
@media(max-width:374px){.pills{gap:3px}.pill{padding:2px 6px;font-size:12.5px;border-width:1.5px}header{gap:4px}}
.ptg{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ptc{text-align:left;display:flex;flex-direction:column;gap:3px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px 16px;font:inherit;color:inherit;cursor:pointer}
.ptc b{font-size:17px;font-weight:900}.ptc span{font-size:13.5px;color:var(--mute);font-weight:700}
.ptc:hover,.ptc:focus-visible{border-color:var(--g)}
.ptc:active{transform:translateY(2px);border-bottom-width:2px}
.ptlives{display:inline-flex;gap:2px;font-size:17px;line-height:1}.ptlife.off{opacity:.22;filter:grayscale(1)}
/* ---- 4.5 side quests: the 3D bank ---- */
.sqrow{display:flex;align-items:center;gap:12px;margin:8px 0 20px;padding:0 4px}
.sqrow.r{flex-direction:row-reverse;text-align:right}
.sqb{position:relative;flex:none;width:96px;height:96px;border:0;background:none;padding:0;cursor:pointer;border-radius:22px;-webkit-tap-highlight-color:transparent}
.sqb:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sqb:active .bk3{transform:scale(.94)}
.sqt{display:flex;flex-direction:column;gap:2px;min-width:0}
.sqt>b{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gdk)}
.sqt>span{font-weight:900;font-size:16px}
.sqt>em{font-style:normal;font-size:13px;color:var(--mute);font-weight:700}
.bk3{position:relative;display:block;width:96px;height:96px;perspective:430px;transition:transform .15s}
.bk3:before{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent)}
.bk3m{position:absolute;left:50%;top:58%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-16deg) rotateY(-28deg);animation:bkSway 7s ease-in-out infinite alternate}
.bk3m>i{position:absolute;left:0;top:0;display:block}
.bk3 .fr{width:54px;height:30px;margin:-15px 0 0 -27px;transform:translateZ(19px);background:linear-gradient(#c9a227,#a7801a) 50% 100%/12px 15px no-repeat,linear-gradient(#e5dcc4,#e5dcc4) 0 0/100% 5px no-repeat,repeating-linear-gradient(90deg,#fffdf6 0 5px,#d8cfb8 5px 7px,#efe8d6 7px 11px)}
.bk3 .bk{width:54px;height:30px;margin:-15px 0 0 -27px;transform:rotateY(180deg) translateZ(19px);background:#cfc5ac}
.bk3 .lf,.bk3 .rt{width:38px;height:30px;margin:-15px 0 0 -19px;background:linear-gradient(#d9cfb7,#d9cfb7) 0 0/100% 5px no-repeat,repeating-linear-gradient(90deg,#e4dbc4 0 6px,#b9ad91 6px 8px)}
.bk3 .lf{transform:rotateY(-90deg) translateZ(27px);filter:brightness(.86)}
.bk3 .rt{transform:rotateY(90deg) translateZ(27px);filter:brightness(.92)}
.bk3 .tp{width:54px;height:38px;margin:-19px 0 0 -27px;transform:rotateX(90deg) translateZ(15px);background:#e2d9c2}
.bk3 .pd{width:60px;height:15px;margin:-7.5px 0 0 -30px;clip-path:polygon(50% 0,100% 100%,0 100%);background:radial-gradient(circle at 50% 72%,#e0b52c 0 3px,transparent 3.6px),linear-gradient(#fbf7ec,#ddd3bb)}
.bk3 .pf{transform:translateY(-22.5px) translateZ(19.5px)}
.bk3 .pb{transform:translateY(-22.5px) rotateY(180deg) translateZ(19.5px);filter:brightness(.8)}
.bk3 .rf{width:34px;height:41px;margin:-20.5px 0 0 -17px}
.bk3 .rl{transform:translate3d(-15px,-22.5px,0) rotateZ(-26.57deg) rotateX(90deg);background:linear-gradient(90deg,#0f7545,#1d9a5f)}
.bk3 .rr{transform:translate3d(15px,-22.5px,0) rotateZ(26.57deg) rotateX(90deg);background:linear-gradient(90deg,#22a867,#13804c)}
.bk3 .st{width:66px;height:48px;margin:-24px 0 0 -33px;transform:rotateX(90deg) translateZ(-15px);background:#cbc1a7}
.bk3 .sf{width:66px;height:7px;margin:-3.5px 0 0 -33px;transform:translateY(18.5px) translateZ(24px);background:repeating-linear-gradient(#e6dfcd 0 2px,#bfb59b 2px 3.5px)}
.bkc{position:absolute;left:50%;top:4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff6c2,#f5c542 46%,#c8900f);box-shadow:0 0 12px rgba(255,196,61,.75),inset 0 0 0 2px rgba(255,255,255,.35);animation:bkCoin 2.6s linear infinite}
.bkl{position:absolute;right:10px;bottom:6px;font-size:18px;font-style:normal;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.bk3.off{filter:grayscale(1) brightness(.92);opacity:.75}
.bk3.off .bk3m{animation-duration:14s}
.bk3.big{width:96px;height:96px;margin:34px auto 44px;transform:scale(1.75)}
.sqb:hover .bk3m{animation-duration:2.4s}
@keyframes bkSway{from{transform:rotateX(-16deg) rotateY(-40deg)}to{transform:rotateX(-16deg) rotateY(24deg)}}
@keyframes bkCoin{0%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-4px) rotateY(180deg)}100%{transform:translateY(0) rotateY(360deg)}}
/* medals: a metal disc on a ribbon */
.mdl{--a:#ffe08a;--b:#d4a017;--r1:#2f6fe0;--r2:#e04f5f;position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;margin-top:15px;border-radius:50%;color:#6b4a00;font-weight:900;font-size:14px;line-height:1;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6) 0 16%,transparent 17%),conic-gradient(from 200deg,var(--a),var(--b),var(--a),var(--b),var(--a));box-shadow:inset 0 0 0 3px rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.2),0 3px 6px rgba(0,0,0,.25)}
.mdl b{position:relative;z-index:1;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.mdl .mrb{position:absolute;left:50%;bottom:72%;width:22px;height:19px;margin-left:-11px;z-index:-1;background:linear-gradient(90deg,var(--r1) 0 50%,var(--r2) 50%);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.mdl.t3:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 60%) -60px 0/200% 100% no-repeat;animation:mShine 3.2s ease-in-out infinite}
.mdl.t2{--a:#f6f7f9;--b:#9aa3ad;color:#38424c}
.mdl.t1{--a:#f2bd8f;--b:#9c5b2b;color:#4a2a10}
.mdl.t0{--a:#d9dfe3;--b:#b6bfc5;--r1:#a9b3ba;--r2:#c4ccd2;color:#73808a;opacity:.55}
.mdl.sm{width:28px;height:28px;font-size:11px;margin-top:11px}.mdl.sm .mrb{width:16px;height:13px;margin-left:-8px}
.mdl.lg{width:56px;height:56px;font-size:19px;margin-top:20px}.mdl.lg .mrb{width:30px;height:26px;margin-left:-15px}
.mdl.xl{width:112px;height:112px;font-size:40px;margin-top:40px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.4),inset 0 -6px 12px rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.3)}.mdl.xl .mrb{width:58px;height:50px;margin-left:-29px}
.mdl.hang{position:absolute;right:-2px;top:0;margin:0}
@keyframes mShine{0%,55%{background-position:-60px 0}100%{background-position:80px 0}}
/* the Diamond Wolf medal */
.dmd{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;margin-top:15px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2a2f6b,#0c1030 70%);box-shadow:inset 0 0 0 3px #c7d2fe,inset 0 0 0 5px #6366f1,0 0 14px rgba(167,139,250,.65)}
.dmd svg{width:78%;height:78%;filter:drop-shadow(0 0 4px rgba(125,211,252,.8))}
.dmd .mrb{position:absolute;left:50%;bottom:72%;width:22px;height:19px;margin-left:-11px;z-index:-1;background:linear-gradient(90deg,#111827 0 50%,#7c3aed 50%);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.dmd .spk{position:absolute;right:10%;top:8%;width:30%;height:30%;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:dTw 1.8s ease-in-out infinite}
.dmd .spk.s2{right:auto;left:12%;top:auto;bottom:14%;width:20%;height:20%;animation-delay:.9s}
.dmd.md{width:40px;height:40px}.dmd.lg{width:64px;height:64px;margin-top:22px}.dmd.lg .mrb{width:34px;height:28px;margin-left:-17px}
.dmd.xl{width:120px;height:120px;margin-top:42px;box-shadow:inset 0 0 0 6px #c7d2fe,inset 0 0 0 10px #6366f1,0 0 40px rgba(167,139,250,.8)}.dmd.xl .mrb{width:62px;height:52px;margin-left:-31px}
.dmd.dim{filter:grayscale(.9);opacity:.5}.dmd.dim .spk{display:none}
@keyframes dTw{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1);opacity:1}}
/* quest screens, the Diamond Vault card and clock, the medal case */
.sqi{text-align:center;display:flex;flex-direction:column;align-items:center}
.sqi h2{margin:6px 0 2px}.sqi p{max-width:420px}
.sqtiers{display:flex;justify-content:center;gap:18px;margin:4px 0 8px}
.sqtiers>span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.sqtiers>span>em{font-style:normal;color:var(--mute);font-size:11.5px;font-weight:700}
.mdrop{display:flex;justify-content:center;margin:0 auto 6px;animation:mDrop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes mDrop{from{transform:translateY(-70px) scale(.5) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.lgc{border:2px solid rgba(167,139,250,.45);background:linear-gradient(135deg,rgba(125,211,252,.12),rgba(167,139,250,.14) 60%,rgba(240,171,252,.12))}
.lgc.won{border-color:#a78bfa;box-shadow:0 0 24px rgba(167,139,250,.35)}
.lgr{display:flex;gap:14px;align-items:center}.lgr h3{margin:0 0 4px}.lgr p{margin:0}
.lgbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:12px 0}
.lgbar i{display:block;height:100%;background:linear-gradient(90deg,#7dd3fc,#a78bfa,#f0abfc)}
.lgt{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.lgb{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.lgb i{display:block;height:100%;background:linear-gradient(90deg,#f0abfc,#a78bfa,#7dd3fc)}
.lgt span{font-weight:900;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.mstrip .mrowi{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:flex-end}
.mcase{display:flex;gap:16px;align-items:center;margin-bottom:18px}.mcase h3{margin:0 0 4px}.mcase p{margin:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;margin-bottom:14px}
.mcell{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:6px 6px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.mcell>.mn{font-size:13.5px;font-weight:900}.mcell>.mt{font-size:12px;color:var(--mute);font-weight:700}
@media (prefers-reduced-motion:reduce){.bk3m,.bkc,.mdl.t3:after,.dmd .spk,.mdrop{animation:none}}
/* very narrow phones: the header fits even with six-figure coin counts */
@media(max-width:374px){header .logo{font-size:15px}.pills{gap:2px}.pill{padding:2px 5px;font-size:12px}}
/* ---- 4.6 crosses: the five medals ---- */
.cx{position:relative;display:inline-block;flex:none;width:44px;line-height:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35)) drop-shadow(0 0 8px var(--gl))}
.cx svg{display:block;width:100%;height:auto}
.cx.off{filter:grayscale(1) brightness(.85);opacity:.32}
.cx.xs{width:18px;vertical-align:-5px;filter:drop-shadow(0 0 3px var(--gl))}
.cx.md{width:44px}.cx.lg{width:76px}.cx.xl{width:150px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4)) drop-shadow(0 0 24px var(--gl))}
.cx:not(.off):not(.xs):after{content:"";position:absolute;inset:30% 8% 0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.7) 50%,transparent 62%) -120px 0/200% 100% no-repeat;clip-path:polygon(35% 0,65% 0,56% 27%,86% 19%,86% 47%,56% 39%,65% 68%,35% 68%,44% 39%,14% 47%,14% 19%,44% 27%);mix-blend-mode:screen;animation:cxShine 4s ease-in-out infinite;pointer-events:none}
.cx .spk{position:absolute;right:6%;top:34%;width:22%;aspect-ratio:1;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:dTw 1.8s ease-in-out infinite}
.cx .spk.s2{right:auto;left:8%;top:auto;bottom:10%;width:15%;animation-delay:.9s}
@keyframes cxShine{0%,60%{background-position:-120px 0}100%{background-position:140px 0}}
.cxmini{display:inline-flex;gap:2px;margin-left:2px}
.cxrow{display:flex;justify-content:space-between;gap:4px;margin-top:6px}
.cxslot{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;flex:1}
.cxslot small{font-size:11px;font-weight:800;color:var(--mute);text-align:center}
.cxlist{display:flex;flex-direction:column;gap:12px;margin:14px 0 16px}
.cxcard{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.cxcard.got{border-color:#f5c542;box-shadow:0 0 0 1px #f5c54255,0 6px 18px rgba(245,197,66,.15)}
.cxinfo{min-width:0;flex:1}.cxinfo h3{margin:0 0 4px}.cxinfo p{margin:0 0 6px}
.cxwon{font-weight:900;color:var(--gdk)}
.cxrev{text-align:center;display:flex;flex-direction:column;align-items:center}
.cxone{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}.cxone h2{margin:12px 0 4px}.cxone p{max-width:380px;margin:0}
.cxrev .cx.xl{animation:mDrop 1s cubic-bezier(.2,1.4,.4,1) both}
/* stars for side-quest vaults */
.sqs{display:inline-flex;gap:1px;font-size:16px;line-height:1;letter-spacing:0}
.sqs i{font-style:normal;color:var(--line);text-shadow:none}
.sqs i.on{color:#ffc43d;text-shadow:0 0 6px rgba(255,196,61,.6),0 1px 0 #b7791f}
.sqs.hang{position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 6px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sqs.xl{font-size:64px;gap:6px}
.sqs.xl i:nth-child(2){transform:translateY(-14px)}
.mcell .sqs{margin:6px 0 2px}
@media (prefers-reduced-motion:reduce){.cx:after,.cx .spk,.cxrev .cx.xl{animation:none}}
/* 4.7: your character */
#gear.avb{padding:0;width:40px;height:40px;position:relative;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#22b36f,#0f7545);border-color:var(--g)}
.havw{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
.hav{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.55);transform-origin:50% 22%}
.hgear{position:absolute;right:-5px;bottom:-4px;font-size:12px;line-height:1;background:var(--card);border:2px solid var(--line);border-radius:50%;padding:2px}
.avbig{position:relative;flex:none;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.avbig .avp{display:block;background:linear-gradient(160deg,#22b36f,#0f7545)}
.avedit{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:900;font-size:12px}
.lkw h3{margin:20px 0 4px}.lkw h3+.xs2{margin:0 0 8px}
.lkp{display:flex;gap:16px;align-items:center;position:sticky;top:0;z-index:2;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:10px 14px;box-shadow:0 8px 18px -12px rgba(0,0,0,.35)}
.lkav{flex:none;width:148px;height:148px;border-radius:50%;overflow:hidden;border:4px solid var(--g);background:linear-gradient(160deg,#22b36f,#0f7545)}
.lkimg{display:block;width:100%;height:100%;object-fit:cover}
.lkinfo{min-width:0;flex:1}.lkinfo>b{display:block;font-size:16px;line-height:1.3}.lkinfo .xs2{margin:4px 0}.lkinfo .btn{margin:6px 0 4px;width:100%}.lkinfo .lnk{font-size:14px}
.lkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.lkt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 9px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;text-align:center}
.lkt.on{border-color:var(--g);box-shadow:0 0 0 2px color-mix(in srgb,var(--g) 35%,transparent)}
.lkt b{font-size:13px;line-height:1.2}
.lkti{width:72px;height:72px;border-radius:50%;object-fit:cover;background:linear-gradient(160deg,#22b36f,#0f7545)}
.lkpr{font-size:12px;font-weight:800;color:var(--mute);display:inline-flex;align-items:center;gap:3px}
.lkpr .wc{width:14px;height:14px}
.lkz{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 8px;font-size:15px}.lkz span{font-size:13px;color:var(--mute);display:inline-flex;align-items:center;gap:4px}.lkz .wc{width:15px;height:15px}
@media(max-width:520px){.lkp{gap:12px;padding:8px 10px}.lkav{width:104px;height:104px;border-width:3px}.lkinfo>b{font-size:15px}.lkinfo .btn{font-size:15px;padding:10px 12px}}
@media(min-width:381px) and (max-width:520px){.lkg{grid-template-columns:repeat(4,1fr);gap:8px}.lkt{padding:7px 4px 8px}.lkti{width:62px;height:62px}.lkt b{font-size:12px}}
@media(max-width:380px){.lkav{width:88px;height:88px}.lkg{grid-template-columns:repeat(3,1fr)}}
/* 4.7.1: admin panel */
.admc{border-color:var(--line)}.admc h3{margin-bottom:2px}.admc .inp{margin-top:6px}
.admr{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.admr:first-of-type{margin-top:8px}
.admr b{display:block;font-size:15px}.admr .xs2{margin:2px 0 0}
.admsw{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px;cursor:pointer;font:inherit;font-weight:900;font-size:13px;color:var(--mute)}
.admsw i{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .15s}
.admsw i:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.admsw[aria-checked="true"]{color:var(--g)}.admsw[aria-checked="true"] i{background:var(--g)}.admsw[aria-checked="true"] i:after{transform:translateX(18px)}
.admsw span{min-width:24px;text-align:left}
.admgive{flex:none;width:auto;margin:0;padding:10px 14px;font-size:14px}
.admdone{flex:none;font-weight:900;color:var(--g);font-size:14px}
.admm:empty{display:none}
@media(prefers-reduced-motion:reduce){.admsw i,.admsw i:after{transition:none}}
@media(min-width:700px){
#app{max-width:1280px;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

main{grid-column:2;grid-row:2}
nav{grid-column:1;grid-row:2;flex-direction:column;justify-content:flex-start;border-top:0;border-right:2px solid var(--line);padding:16px 12px;gap:6px}
nav button{display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;padding:12px 14px;border-radius:12px}nav button:hover{background:var(--line)}nav span{display:inline;font-size:22px}
#learn,#news,#picks,#hist,#dev{padding:28px max(32px,calc((100% - 880px)/2))}
.gr{grid-template-columns:repeat(3,1fr)}.gc:hover,.opt:hover,.chip:hover,.tl:hover,.row:hover,.btn:hover{filter:brightness(.96)}
#hist.on{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}#hist .card{margin:0}#hist>.mrow{grid-column:1/-1;margin:0}
#news.on{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}#news .card{margin:0}#news>.card:first-child{grid-column:1/-1}
#msgs{padding:24px max(32px,calc((100% - 820px)/2))}.m{max-width:75%;font-size:16px}
#chips,#tools,#bar2,#chat .note{width:100%;max-width:820px;margin-left:auto;margin-right:auto}
.in{max-width:760px}#qb h2{font-size:30px}.opt{font-size:19px}.cvw svg{height:250px}.node:hover:not(:disabled){filter:brightness(1.07)}
#prac.on{display:grid;grid-template-columns:1fr 1fr;align-content:start}
#prac>.tape,#prac>.xp{grid-column:1/-1}
#pn{grid-template-columns:1fr 1fr}#pn .cw svg{height:230px}.tape{font-size:15px}
#dev .pic{max-width:640px;display:block;margin-left:auto;margin-right:auto}#dev .cl{columns:2}nav button{flex:0 0 auto}
}

"Fees such as commissions and fund expense ratios eat into returns over time. Beware promises of guaranteed or risk-free profits, pump-and-dump hype and thinly traded penny stocks. Research a company before you buy.",
"The income statement shows revenue (sales), costs and profit. Gross profit is revenue minus the cost of goods sold. Net income is what remains after all costs and taxes, and EPS is net income divided by shares.",
"The balance sheet lists assets (what a company owns), liabilities (what it owes) and equity (assets minus liabilities). Ratios like debt-to-equity show how much a company relies on borrowing.",

/* rough yearly dividend yields used by the simulator (for learning, not real data) */
const DYLD={MSFT:.008,AAPL:.004,JPM:.02,WMT:.009,LLY:.006,AVGO:.012,GOOGL:.003,META:.003,NVDA:.0003,SPY:.012,QQQ:.006,TLT:.04,LQD:.045,EWJ:.02,INDA:.008,ASHR:.02,RELIANCE:.004,HDFCBANK:.011,ICICIBANK:.008,INFY:.025,BHARTIARTL:.004,TECHM:.025,NESTLEIND:.015,BEL:.006,TRENT:.001,'7203':.025,'6758':.006,'600519':.03,'300750':.015,'601318':.05};
const FEE=.001,FEEMIN=.05;/* simulated trading costs: 0.1% of the trade, at least $0.05 (about ₹5) */
const isINR=()=>S&&S.cur=='INR';
const toCur=v=>isINR()?v*FXINR:v,fromCur=v=>isINR()?v/FXINR:v,curSym=()=>isINR()?'₹':'$';
function feeOf(v){return Math.max(FEEMIN,v*FEE)}
function xh(e){if(!Array.isArray(X.h))X.h=[];X.h.push(Object.assign({ts:Date.now()},e));if(X.h.length>200)X.h.shift()}
/* the one place trades happen: market orders, filled limit and stop orders */
function execTrade(i,sd,v,why){const k=MK[i],p=pr[i];if(!isOpen(k[4]))return 'Market closed. You can trade when it reopens.';if(!(v>0))return 'Enter an amount.';
 if(sd=='b'){const fee=feeOf(v);if(v+fee>X.cash+1e-6)return 'Not enough cash. You have '+$m(X.cash)+'.';const o=X.pos[k[0]]||{sh:0,c:0};o.sh+=v/p;o.c+=v+fee;X.pos[k[0]]=o;X.cash=Math.max(0,X.cash-v-fee);xh({tk:k[0],sd:'b',v,px:p,fee,why});stat('trade');dailyBump('t');badgeCheck();missionCheck();return 'Bought '+$m(v)+' of '+k[0]+' at '+$m(p)+' (costs '+$m(fee)+')'+(why?' · '+why:'')}
 const o=X.pos[k[0]];if(!o)return 'You do not own '+k[0]+'.';const t=o.sh*p;let a=Math.min(v,t);if(a>t-.005)a=t;const f=a/t,fee=feeOf(a),cost=o.c*f,pl=a-fee-cost;X.cash+=a-fee;X.real=(X.real||0)+pl;if(f>.9999)delete X.pos[k[0]];else{o.c*=1-f;o.sh*=1-f}
 xh({tk:k[0],sd:'s',v:a,px:p,fee,pl,why});stat('trade');dailyBump('t');badgeCheck();missionCheck();return 'Sold '+$m(a)+' of '+k[0]+' at '+$m(p)+' ('+(pl>=0?'profit ':'loss ')+$m(Math.abs(pl))+' after costs)'+(why?' · '+why:'')}
function trade0(n,sd){const P=PN[n],i=P.i,inp=gi(sd=='b'?'bi':'si',n),v=fromCur(parseFloat(inp.value));const r=execTrade(i,sd,v);say(n,r);if(/^(Bought|Sold)/.test(r)){inp.value='';saveX();if(sd=='b'&&!S.gft){S.gft=1;save()}}paint()}
/* pending orders: limit buy, limit sell (take profit), stop-loss sell */
function placeOrder(n){const P=PN[n],k=MK[P.i],ty=gi('ot',n).value,px=fromCur(parseFloat(gi('op',n).value)),amt=fromCur(parseFloat(gi('oa',n).value));
 if(!(px>0))return say(n,'Enter the trigger price.');if(ty!='lb'&&!X.pos[k[0]])return say(n,'You need to own '+k[0]+' to place a sell order.');if(ty=='lb'&&!(amt>0))return say(n,'Enter how much to buy.');
 if(!Array.isArray(X.ord))X.ord=[];if(X.ord.length>=20)return say(n,'You can have up to 20 open orders.');
 X.ord.push({id:tid(),tk:k[0],ty,px,amt:ty=='lb'?amt:0,ts:Date.now()});saveX();award('ord');gi('op',n).value='';gi('oa',n).value='';
 say(n,{lb:'Limit buy placed: buys when '+k[0]+' falls to '+$m(px)+' or lower.',ls:'Limit sell placed: sells all '+k[0]+' when it rises to '+$m(px)+' or higher.',sl:'Stop-loss placed: sells all '+k[0]+' if it falls to '+$m(px)+' or lower.'}[ty]);paint()}
function ordersCheck(){if(!Array.isArray(X.ord)||!X.ord.length){alertsCheck();return}let ch=0;
 X.ord=X.ord.filter(o=>{const i=IX[o.tk];if(i==null)return false;if(!isOpen(MK[i][4]))return true;const p=pr[i];let hit=false,msg='';
  if(o.ty=='lb'&&p<=o.px){msg=execTrade(i,'b',Math.min(o.amt,Math.max(0,X.cash-feeOf(o.amt))),'limit order filled');hit=true}
  else if(o.ty=='ls'&&p>=o.px&&X.pos[o.tk]){msg=execTrade(i,'s',X.pos[o.tk].sh*p,'limit sell filled');hit=true}
  else if(o.ty=='sl'&&p<=o.px&&X.pos[o.tk]){msg=execTrade(i,'s',X.pos[o.tk].sh*p,'stop-loss triggered');hit=true}
  else if(o.ty!='lb'&&!X.pos[o.tk])return false;
  if(hit){ch=1;toast(msg,'🎯')}return !hit});
 if(ch)saveX();alertsCheck()}

/* dividends: paid once a day on holdings that pay them (rough yields) */
function divCheck(){const d=ds(new Date());if(X.dv===d)return;const last=X.dv;X.dv=d;if(!last){saveX();return}const days=Math.min(30,Math.max(1,Math.round((Date.parse(d)-Date.parse(last))/864e5)||1));let tot=0;

 if(tot>0){X.real=(X.real||0)+tot;toast('Dividends paid: '+$m(tot),'💵')}saveX()}

 const key=e=>{if(e.key=='Escape'){e.preventDefault();e.stopPropagation();done(false)}else if(e.key=='Tab'){e.preventDefault();e.stopPropagation();const f=[...w.querySelectorAll('button')],i=f.indexOf(document.activeElement);f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus()}else if(e.key!='Enter'&&e.key!=' ')e.stopPropagation()};
 const done=v=>{w.remove();document.removeEventListener('keydown',key,true);try{prev&&prev.focus&&prev.focus()}catch(e){}res(v)};
 w.addEventListener('click',e=>{const b=e.target.closest('[data-cf]');if(b)done(b.dataset.cf=='1');else if(e.target===w)done(false)});
 document.addEventListener('keydown',key,true);document.body.appendChild(w);setTimeout(()=>{const f=w.querySelector(o.danger?'[data-cf="0"]':'[data-cf="1"]');if(f)f.focus()},30)})}

/* ---- FAQ ---- */
const FAQ=[
['Is Wally Street free?','Yes. There are no payments, subscriptions or ads.'],
['Is the money in Practice real?','No. Practice uses simulated prop money (paper money). It starts at $100,000, can never be withdrawn or turned into cash, and real trades are never placed.'],
['Is this financial advice?','No. Wally Street is for learning only. It never tells you what to buy or sell. For real decisions, speak to a qualified, registered adviser.'],
['Do I need an account?','No. You can play as a guest, and your progress is saved in this browser. An account adds a password and, where sync is on, lets you log in with your username and password on any device and carry on where you left off.'],
['I moved the game to a new web address. Where is my progress?','Progress is kept in your browser separately for each web address. On the old address, open ⚙️ → System status, security and backups and tap Download backup. On the new address, open the same screen and tap Restore from file. If you were signed in, log in afterwards with the same username and password.'],
['How do I sync across devices?','Create an account, then log in with the same username and password on your other device. On the website and the download file this works once the operator has switched on the sync server. On the accounts link it works for the person who owns that link. Your progress is encrypted with your password before it is uploaded, so nobody else can read it, which also means a forgotten password cannot be recovered.'],
['Where is my progress saved?','In your browser on this device (encrypted if you have an account). Clearing your browser data deletes it, so download a backup now and then from ⚙️ → System status.'],
['How do hearts work?','You get 5 hearts every day, and all 5 come back at 12:00 AM IST. A wrong answer in a lesson costs one heart. As soon as you lose one, you can earn it back with a 5-question practice (wrong answers there cost nothing), or buy one for 100 Wally coins. Tap the hearts at the top of the screen to do either. History stories, reviews and quizzes never cost hearts.'],
['How many lessons are there?','64 lessons in 16 units: 14 units across 6 levels, a trading strategies unit and an India essentials unit. Every unit ends with a revision that mixes questions from that unit with questions from the units before it, a different mix each time.'],
['What are side quests?','Every unit has a side quest: the 3D bank beside the lesson path. It opens once you finish the unit\'s lessons. Crack the vault by answering 10 questions from that unit with 3 keys (each wrong answer breaks one; hearts are not used). No mistakes gives 3 stars, one mistake 2 stars and two mistakes 1 star, and you can replay to add stars.'],
['What are the medals?','Only five medals exist in Wally Street, and each is a cross that is very hard to earn. Mastery Cross: finish every lesson and revision. Flawless Cross: finish 30 different lessons in a row without a single mistake. Diamond Cross: get 3 stars on all 16 vaults, then clear the Diamond Vault (30 questions, one key, 15 seconds each). Devotion Cross: reach a 100-day streak. Honour Cross: collect all 20 badges. Each one adds 1,000 Wally coins and stays yours for good. They show on your profile in ⚙️, next to your name on Learn, and on a picture you can share.'],
['How do I change my character?','Tap your picture at the top right, then Change. Pick a character (Wally is free; the Fox costs 600 Wally coins, the Eagle 800 and the Lion 1,000), a suit (Zone 1 suits cost 700 coins, Zone 2 300 and Zone 3 100) and a tie (from 100 to 400 coins). Tap anything to try it on first. Things you buy are yours for good, so you can switch between them for free. The new characters only appear in your profile picture, not in lessons.'],
['How does the placement test work?','Pick the level you want to start at. You get 15 questions on the lessons before it, easiest first, and 3 lives just for the test: each wrong answer costs one, and your hearts are not used. Finish with at least one life left and everything before that level is marked done, plus 100 Wally coins. Run out of lives and nothing changes, so you can try again or pick a closer level. Find it on the Learn page or in ⚙️ → Learning.'],
['How do Wally coins and streaks work?','Wally coins are the golden coins with Wally on them (they used to be called XP). You earn them for lessons (50 to 80), the daily goal (+20), the placement test (+100), the news quiz (+30) and missions (+100). Mistakes reviews give no coins. Your streak grows each day you finish a lesson, and a streak freeze (200 coins, up to 2) protects a day you miss, and 100 coins buy a heart. In Practice, 100 Wally coins turn into $1,000 of practice cash. Wally coins are not real money and have no cash value.'],
['Why can\'t I trade right now?','In Practice the US market is open around the clock, every day, so you can always trade US stocks and funds. The real US market runs 9:30 AM to 4:00 PM Eastern time on weekdays, and the app shows whether it is open right now. China (9:30 AM to 3:00 PM Beijing time), Japan (9:00 AM to 3:30 PM Tokyo time) and India (9:15 AM to 3:30 PM IST) follow their real hours, Monday to Friday. Orders for those markets wait until they open.'],
['Why are prices different from my broker\'s?','Starting prices are real closing prices from the date shown in the app. After that, the moves are simulated, so they won\'t match live prices.'],
['What do fees and dividends do in Practice?','Each trade costs 0.1% (at least $0.05) so you learn that trading isn\'t free. Some holdings pay a small simulated dividend each day, based on rough real yields.'],
['How does the tutor answer?','Wally answers from built-in notes, which work offline. Tap 📋 Available questions to see 50 it always knows. On some shared links, Wally can also write fuller answers with an online answer service, if you allow it. Never type passwords, card numbers or ID numbers: the tutor blocks them.'],
['How do I reset or delete things?','To reset Practice, use the reset button at the bottom of the Practice screen. To delete your account, open ⚙️, type your current password and tap Delete my account. You will always be asked to confirm first.'],
['How do classes work?','A teacher makes a class code in ⚙️ → Classroom and shares it. Students join with the code and send back a result code. Nothing goes through a server, so the leaderboard works on trust.'],
['Who can use Wally Street?','People aged 13 and over. If you are under 18, ask a parent or guardian before using it.'],
['How do I report a mistake?','Tap 🚩 Report a mistake under any answer, or use the help button → Report a problem.'],
['Who made Wally Street?','Wally Street is made and run by its operator (see Contact).']];

 return `<div class="card cxstrip"><div class="dgh"><h3>Medals</h3><button class="lnk" data-medals="1">Medal case</button></div><div class="cxrow">${CROSSES.map(c=>`<span class="cxslot">${crossHTML(c.k,'md')}<small>${esc(c.n.replace(' Cross',''))}</small></span>`).join('')}</div><p class="xs2" style="margin:8px 0 0">${n} of 5 crosses · the only medals in Wally Street</p>${n?'<button class="btn ghost" data-card="crosses" style="margin-top:10px">📸 Show them off</button>':''}</div>`}
function showMedals(){const n=cxCount(),M=medals();
 showDoc('Medal case',`<p>Only five medals exist in Wally Street, and each one is very hard to earn. ${n?`You hold ${n} of them.`:'You don\'t hold any yet.'}</p>
 <div class="cxlist">${CROSSES.map(c=>{const got=cxHave()[c.k],[v,t,lab]=cxProgress(c.k);return `<div class="cxcard${got?' got':''}">${crossHTML(c.k,'lg')}<div class="cxinfo"><h3>${esc(c.n)}</h3><p>${esc(c.d)}</p>${got?`<p class="cxwon">Earned on ${esc(new Date(got+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}))}</p>`:`<div class="lgbar" aria-hidden="true"><i style="width:${Math.round(Math.min(1,v/t)*100)}%"></i></div><p class="xs2" style="margin:0">${v} of ${t} ${esc(lab)}</p>`}</div></div>`}).join('')}</div>
 ${n?'<button class="btn" data-card="crosses">📸 Show them off</button>':''}
 <h3 style="margin-top:22px">Side-quest vaults</h3><div class="mgrid">${sqList().map(q=>{const t=M[q.key]||0;return `<div class="mcell${t?'':' none'}">${starsHTML(t)}<b class="mn">${esc(q.short)}</b><span class="mt">${t?starTxt(t):sqOpen(q)?'Vault open':'Locked'}</span></div>`}).join('')}</div>
 <p class="xs2">3 stars: no mistakes. 2 stars: one mistake. 1 star: two mistakes. 3 stars on every vault opens the Diamond Vault.</p>`)}
/* a picture to share: every cross, earned ones in full colour */
function cxDraw(c,cr,x,y,s,on){c.save();c.translate(x,y);c.scale(s,s);c.globalAlpha=on?1:.18;
 const g=c.createLinearGradient(0,0,100,112);g.addColorStop(0,cr.c[0]);g.addColorStop(.55,cr.c[1]);g.addColorStop(1,cr.c[2]);
 const rim=c.createLinearGradient(0,30,0,110);rim.addColorStop(0,'#fffbe6');rim.addColorStop(.5,cr.rim);rim.addColorStop(1,'#7c5c10');
 if(on){c.shadowColor=cr.gl;c.shadowBlur=30}
 c.fillStyle=cr.r[0];c.fill(new Path2D('M30 0h40v26L50 38 30 26z'));c.fillStyle=cr.r[1];c.fill(new Path2D('M43 0h14v31l-7 4-7-4z'));
 const p=new Path2D(CXP);c.fillStyle=g;c.fill(p);c.shadowBlur=0;c.lineWidth=3.5;c.lineJoin='round';c.strokeStyle=rim;c.stroke(p);
 c.beginPath();c.arc(50,70,13,0,7);c.fillStyle=rim;c.fill();c.beginPath();c.arc(50,70,10.5,0,7);c.fillStyle=g;c.fill();
 c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.font='900 '+(cr.e.length>2?10:cr.e.length>1?12:14)+'px Nunito,Arial,sans-serif';c.fillText(cr.e,50,71);c.restore()}
async function crossCard(){const cv=document.createElement('canvas');cv.width=1080;cv.height=1920;const c=cv.getContext('2d'),gr=c.createLinearGradient(0,0,1080,1920);gr.addColorStop(0,'#0a1630');gr.addColorStop(.55,'#0b3d2c');gr.addColorStop(1,'#111827');c.fillStyle=gr;c.fillRect(0,0,1080,1920);
 const w=await loadImg(WOLF);circ(c,w,440,120,200);c.textAlign='center';c.fillStyle='#ffc43d';c.font='900 60px Nunito,Arial,sans-serif';c.fillText('WALLY STREET',540,400);
 const n=cxCount();c.fillStyle='#fff';c.font='900 120px Nunito,Arial,sans-serif';c.fillText(n+' of 5',540,560);c.font='800 52px Nunito,Arial,sans-serif';c.fillStyle='#d8f5e6';c.fillText(n==1?'medal earned':'medals earned',540,640);
 const pos=[[95,720],[400,720],[705,720],[247,1180],[553,1180]];
 CROSSES.forEach((cr,i)=>{const on=!!cxHave()[cr.k],[x,y]=pos[i];cxDraw(c,cr,x,y,2.8,on);c.globalAlpha=on?1:.4;c.fillStyle='#fff';c.font='800 38px Nunito,Arial,sans-serif';c.textAlign='center';c.fillText(cr.n,x+140,y+360);c.globalAlpha=1});
 c.fillStyle='#fff';c.font='700 50px Nunito,Arial,sans-serif';c.fillText(S.name+' · '+(S.xp||0).toLocaleString('en-IN')+' Wally coins',540,1720);
 c.fillStyle='#9fb8ab';c.font='600 40px Nunito,Arial,sans-serif';c.fillText('Only five medals exist. Can you get one?',540,1800);return cv}

/* ================= Wally Street 4.6.1: Practice opens on the two stocks you traded most recently ================= */
var PNWHO;
/* the two most recent different stocks you bought or sold, newest first (dividends do not count) */
function pnRecent(){const h=Array.isArray(X.h)?X.h:[],r=[];for(let j=h.length-1;j>=0&&r.length<2;j--){const e=h[j];if(!e||(e.sd!='b'&&e.sd!='s'))continue;const i=IX[e.tk];if(i!=null&&!r.includes(i))r.push(i)}return r}
/* puts them in the first two charts. Leaves your charts alone when both are already showing, and starts clean when someone else signs in */
function pnRestore(){const who=ACC?ACC.uid:'',fresh=who!==PNWHO,r=pnRecent();PNWHO=who;
 if(!r.length){if(fresh&&(PN.length>1||PN[0].i!==0)){PN=[{i:0,ct:'l',tb:'b',hov:-1}];ap=0;return true}return false}
 const on=PN.map(p=>p.i);if(!fresh&&r.every(i=>on.includes(i)))return false;
 PN=r.map(i=>({i,ct:'l',tb:'b',hov:-1}));ap=0;
 mkt=MK[r[0]][4]||'US';document.querySelectorAll('.mk').forEach(d=>d.hidden=d.dataset.m!=mkt);return true}
try{pnRestore()}catch(e){}

const A11Y_HTML="<p class=\"tcm\">Last updated: 19 October 2026</p><h3>Our commitment</h3><p>Wally Street is a learning game about stocks and markets. We want people with different abilities, devices and assistive technology to be able to use it. We are working toward the Web Content Accessibility Guidelines (WCAG) 2.1 level AA. This statement is our own review. It is not a certified audit, and we have not had an independent accessibility audit.</p><h3>What we have done</h3><ul><li><b>Phones and laptops.</b> The layout adapts to the screen size. On a laptop the menu moves to a side bar, and pinch zoom on phones is not blocked.</li><li><b>Keyboard.</b> Buttons, links and fields are real controls that you can reach with the Tab key, and they show a visible focus outline. In lessons on a laptop you can press 1, 2 or 3 to pick an answer, Enter to check or continue, and Esc to leave.</li><li><b>Light and dark themes.</b> The app follows your device setting. You can switch in Manage account, then Appearance.</li><li><b>Reduced motion.</b> If your device asks for reduced motion, animations are turned off.</li><li><b>Labels for screen readers.</b> Icon buttons, form fields and charts have text labels. Right and wrong answers are shown in words (\"Correct!\", \"Correct answer: ...\") and not by colour alone.</li><li><b>Tutorial videos.</b> Every tutorial scene shows its narration as on-screen text. Voice is optional and off by default, and you can pause, go back or skip. Nothing plays sound without your action.</li><li><b>Clear errors.</b> Sign-in problems are explained in plain text next to the form.</li></ul><h3>Known limits</h3><ul><li>Price charts, candlestick charts and quiz charts are drawn images. Their text label is short and does not describe every data point. The tables next to the Practice charts give prices and changes as text.</li><li>The chart crosshair works with touch and mouse but has no keyboard version yet.</li><li>Some muted grey text and parts of the dark Practice screen may be below the AA contrast ratio.</li><li>Tutorial scenes move on by themselves after a few seconds. You can press Pause, but some people may need more time than the default.</li><li>The Ask tutor is a text box with replies that appear below it. We have not tested it with screen readers.</li><li>Narration uses the voices installed on your device, so quality and gender vary. You can choose another voice in Manage account.</li><li>We have not tested every combination of browser and assistive technology. Fonts load from Google Fonts, so the page falls back to your device fonts if they cannot load.</li></ul><h3>Tell us about a problem</h3><p>If something is hard to use, please tell the operator through the same channel you used to get the app, and say what you were trying to do, which device and browser you used, and which assistive technology you use if any. We aim to reply in a reasonable time and to fix what we can. If you are not happy with our reply, you may contact the accessibility or consumer authority where you live.</p>";

e a username and password.","✅ Sessions expire after 30 days and are renewed on every visit. The session key sits in the browser's key vault and cannot be copied out.","✅ The host serves the page over HTTPS.","✅ Account data is AES-256-GCM encrypted on the device and in the cloud.","✅ HTTPS, and the data is already encrypted before it is uploaded.","✅ Chat messages are filtered for script and SQL patterns.","✅ Rate limits on every call. Network-level protection is the host's job.","✅ No cross-site API calls are made.","✅ No cookies are used, so cross-site request forgery has nothing to use.","✅ There is no SQL database, and all inputs are validated.","✅ Text you type is escaped before it is shown.","✅ The app never fetches a web address that you type.","✅ Older saved data is upgraded to the new format automatically.","✅ Saved data carries a schema version (now v2).","✅ Daily automatic backups, plus download and restore.","✅ Download a backup file at any time.","✅ If the cloud is down, saves fail over to your device and catch up later.","➖ Needs servers in several regions.","✅ Run a chaos test below to inject failures on purpose.","✅ Charts stop updating while the tab is hidden, which saves battery and data.","✅ Startup time is measured and shown below.","✅ Cloud saves over 500 KB are refused, to stay inside storage limits.","✅ The median call time is shown for each service.","✅ Calls per minute are shown for each service.","✅ The 99th-percentile time is shown for each service.","✅ The gap between median and p99 shows the slow tail.","✅ Going offline is detected, and saves wait until you are back.","✅ If your device clock jumps backwards, you get a warning.","➖ Handled by your network.","➖ Handled by the browser.","➖ Negotiated by the browser and the host.","➖ Needs a server.","➖ Needs a server to receive calls.","✅ Cloud records are tagged with API version v1.","✅ The app version (3.0.0) is shown below.","➖ No servers to describe.","➖ No servers to describe.","➖ No function opsHTML(){const H=health(),sv=['save.local','cloud.write'].map(k=>MET[k]||{n:0,err:0}),tot=sv[0].n+sv[1].n,er=sv[0].err+sv[1].err,sli=tot?(1-er/tot)*100:100,bud=tot?Math.max(0,100-er/(tot*.01)*100):100,n=Date.now();
 const B=(LS('stockgpt:bak')||[]).filter(x=>x&&x.uid==(ACC?ACC.uid:null));let i0=0;
 const rows=Object.keys(MET).sort().map(k=>{const m=MET[k],pm1=m.ts.filter(t=>n-t<6e4).length,cache=k=='answer.cache';return `<tr><td>${esc(k)}</td><td>${m.n}</td><td>${cache?(m.n-m.err)+' hits':m.err}</td><td>${cache?'–':Math.round(pct(m.lat,50))+' ms'}</td><td>${cache?'–':Math.round(pct(m.lat,99))+' ms'}</td><td>${pm1}</td></tr>`}).join('');
 return `<p class="tcm">Wally Street ${APP_VER} · data schema v${SCHEMA_V} · API ${API_V} · cold start ${COLD} ms · tab ${TAB}${LEADER?' (leader)':''}</p>
<p>This page shows how the app protects your data and keeps working when something fails. Everything here runs on your device.</p>

<h3>Incidents and postmortems</h3>${INC.length?INC.slice().reverse().map(i=>`<p>${i.end?'✅ Resolved':'🔴 Ongoing'} · ${new Date(i.start).toLocaleString()}<br>${pm(i)}</p>`).join(''):'<p>No incidents. All quiet.</p>'}
<h3>Feature flags</h3>${[['ai','Online answers in the tutor'],['tape','Ticker tape in Practice'],['anim','Animations']].map(f=>`<label class="ck"><input type="checkbox" data-ff="${f[0]}"${flag(f[0])?' checked':''}> <span>${f[1]}</span></label>`).join('')}
